name: Build and Upload to TestFlight

# Manual: open the Actions tab, pick this workflow, press "Run workflow".
# Two jobs run side by side:
#   testflight  archives, signs and uploads to TestFlight (build number = this run's number)
#   simulator   builds for the iOS Simulator and publishes Ahead-simulator.zip for Appetize.io:
#               https://github.com/ralphgeb/MyiOSApp/releases/download/ios-simulator-latest/Ahead-simulator.zip
on:
  workflow_dispatch:
    inputs:
      target:
        description: What to build
        type: choice
        options: [both, testflight, simulator, iap-check, iap-rename]
        default: both

# One run at a time: each run clears the signing certificates CI made, so two at once would clash.
concurrency:
  group: ahead-build
  cancel-in-progress: false

permissions:
  contents: write   # the simulator job publishes a release

jobs:
  iap-check:
    # Read-only: prints the state of Ahead Plus in App Store Connect (changes nothing).
    if: inputs.target == 'iap-check'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet "pyjwt[crypto]" requests
      - name: Check Ahead Plus in App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: python3 tools/asc_iap_check.py

  iap-rename:
    # Names the in-app purchase "Ahead Plus" in App Store Connect and prints its UK and US prices.
    if: inputs.target == 'iap-rename'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet "pyjwt[crypto]" requests
      - name: Rename to Ahead Plus
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: python3 tools/asc_iap_rename.py

  testflight:
    if: inputs.target == 'both' || inputs.target == 'testflight'
    runs-on: xcode-27   # Xcode 27 (iOS 27 SDK): the iPhone Duo's full screen, as in Halo
    timeout-minutes: 45
    defaults:
      run:
        working-directory: CalendarWidgetApp

    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check the secrets are set and look right
        run: |
          bad=0
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then echo "::error::Missing GitHub secret $v"; bad=1; fi
          done
          trim() { printf %s "$1" | tr -d '[:space:]'; }
          team=$(trim "$APPLE_TEAM_ID"); key=$(trim "$ASC_KEY_ID"); iss=$(trim "$ASC_ISSUER_ID")
          [ "${#APPLE_TEAM_ID}" != "${#team}" ] && echo "::warning::APPLE_TEAM_ID had stray spaces or a line break; ignoring them"
          [ "${#ASC_KEY_ID}" != "${#key}" ] && echo "::warning::ASC_KEY_ID had stray spaces or a line break; ignoring them"
          [ "${#ASC_ISSUER_ID}" != "${#iss}" ] && echo "::warning::ASC_ISSUER_ID had stray spaces or a line break; ignoring them"
          [[ "$team" =~ ^[A-Z0-9]{10}$ ]] || { echo "::error::APPLE_TEAM_ID should be 10 letters/digits, yours is ${#team} characters"; bad=1; }
          [[ "$key" =~ ^[A-Z0-9]{10}$ ]] || { echo "::error::ASC_KEY_ID should be 10 letters/digits, yours is ${#key} characters"; bad=1; }
          [[ "$iss" =~ ^[0-9a-fA-F]{8}-([0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$ ]] || { echo "::error::ASC_ISSUER_ID should look like xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"; bad=1; }
          echo "$ASC_PRIVATE_KEY" | grep -q "BEGIN PRIVATE KEY" || { echo "::error::ASC_PRIVATE_KEY must include the -----BEGIN PRIVATE KEY----- line"; bad=1; }
          echo "$ASC_PRIVATE_KEY" | grep -q "END PRIVATE KEY" || { echo "::error::ASC_PRIVATE_KEY must include the -----END PRIVATE KEY----- line"; bad=1; }
          [ "$(echo "$ASC_PRIVATE_KEY" | wc -l | tr -d ' ')" -lt 3 ] && echo "::error::ASC_PRIVATE_KEY is on one line; paste it exactly as in the .p8 file (several lines)" && bad=1
          [ "$bad" = 0 ] || exit 1
          echo "Secrets look well-formed."

      - name: Save the App Store Connect API key
        run: |
          echo "$ASC_PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey.p8"

      - name: Remove old Development certificates (so Apple's certificate limit never blocks a build)
        continue-on-error: true
        run: |
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography || python3 -m pip install --quiet pyjwt cryptography
          python3 - <<'PY'
          import os, time, json, urllib.request, urllib.error, urllib.parse
          import jwt
          key = open(os.environ["RUNNER_TEMP"] + "/AuthKey.p8").read()
          kid = os.environ["ASC_KEY_ID"].strip()
          iss = os.environ["ASC_ISSUER_ID"].strip()
          now = int(time.time())
          token = jwt.encode({"iss": iss, "iat": now, "exp": now + 600, "aud": "appstoreconnect-v1"},
                             key, algorithm="ES256", headers={"kid": kid, "typ": "JWT"})
          def call(method, url):
              req = urllib.request.Request(url, method=method, headers={"Authorization": "Bearer " + token})
              with urllib.request.urlopen(req) as r:
                  body = r.read()
                  return json.loads(body) if body else {}
          q = urllib.parse.urlencode({"limit": "200", "filter[certificateType]": "DEVELOPMENT,IOS_DEVELOPMENT"})
          try:
              certs = call("GET", "https://api.appstoreconnect.apple.com/v1/certificates?" + q).get("data", [])
              print("Found", len(certs), "development certificate(s)")
              for c in certs:
                  name = c["attributes"].get("name") or c["attributes"].get("displayName") or c["id"]
                  try:
                      call("DELETE", "https://api.appstoreconnect.apple.com/v1/certificates/" + c["id"])
                      print("Deleted", name, c["id"])
                  except urllib.error.HTTPError as e:
                      print("::warning::Could not delete", name, e.code, e.read().decode()[:300])
          except urllib.error.HTTPError as e:
              print("::warning::Certificate cleanup skipped:", e.code, e.read().decode()[:300])
          PY

      - name: Select the newest released Xcode
        run: |
          echo "Installed Xcodes:"; ls -d /Applications/Xcode*.app
          best=""; bestv=0
          for x in $(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -viE "beta|rc|preview"); do
            v=$(DEVELOPER_DIR="$x/Contents/Developer" xcodebuild -version 2>/dev/null | awk 'NR==1{print $2}')
            n=$(echo "$v" | awk -F. '{printf "%d%03d%03d", $1, $2, $3}')
            if [ -n "$v" ] && [ "$n" -gt "$bestv" ]; then best=$x; bestv=$n; fi
          done
          if [ -n "$best" ]; then sudo xcode-select -s "$best/Contents/Developer"; fi
          xcodebuild -version; swift --version
          echo "::notice::Using $(xcodebuild -version | head -1) / $(swift --version 2>&1 | head -1)"

      - name: Generate Xcode project (XcodeGen)
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Archive (Xcode creates and signs with Apple-managed certificates)
        run: |
          APPLE_TEAM_ID=$(printf %s "$APPLE_TEAM_ID" | tr -d '[:space:]')
          ASC_KEY_ID=$(printf %s "$ASC_KEY_ID" | tr -d '[:space:]')
          ASC_ISSUER_ID=$(printf %s "$ASC_ISSUER_ID" | tr -d '[:space:]')
          mkdir -p build
          set -o pipefail
          xcodebuild archive \
            -project CalendarWidgetApp.xcodeproj \
            -scheme CalendarWidgetApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            2>&1 | tee build/archive.log || {
              # Show the real reasons as red annotations at the top of the run page
              grep -E -A2 "error:|ARCHIVE FAILED|No profiles|requires a provisioning|Provisioning profile|No Accounts|not registered" build/archive.log \
                | grep -v '^--$' | sed 's/%/%25/g; s/Team "[A-Z0-9]*"/Team "(hidden)"/' | awk '!seen[$0]++' | head -25 | while IFS= read -r line; do echo "::error::${line}"; done
              exit 1
            }

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: CalendarWidgetApp/build/*.log

      - name: Export and upload to TestFlight
        run: |
          APPLE_TEAM_ID=$(printf %s "$APPLE_TEAM_ID" | tr -d '[:space:]')
          ASC_KEY_ID=$(printf %s "$ASC_KEY_ID" | tr -d '[:space:]')
          ASC_ISSUER_ID=$(printf %s "$ASC_ISSUER_ID" | tr -d '[:space:]')
          set -o pipefail
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tee build/export.log || {
            grep -iE "error|invalid|failed|already|rejected|missing" build/export.log | sort -u | head -15 | while read -r l; do echo "::error::${l:0:400}"; done
            exit 1
          }

  simulator:
    if: inputs.target == 'both' || inputs.target == 'simulator'
    runs-on: xcode-27
    timeout-minutes: 40
    defaults:
      run:
        working-directory: CalendarWidgetApp
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest released Xcode
        run: |
          best=""; bestv=0
          for x in $(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -viE "beta|rc|preview"); do
            v=$(DEVELOPER_DIR="$x/Contents/Developer" xcodebuild -version 2>/dev/null | awk 'NR==1{print $2}')
            n=$(echo "$v" | awk -F. '{printf "%d%03d%03d", $1, $2, $3}')
            if [ -n "$v" ] && [ "$n" -gt "$bestv" ]; then best=$x; bestv=$n; fi
          done
          if [ -n "$best" ]; then sudo xcode-select -s "$best/Contents/Developer"; fi
          xcodebuild -version

      - name: Generate Xcode project (XcodeGen)
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project CalendarWidgetApp.xcodeproj \
            -scheme CalendarWidgetApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            2>&1 | tee build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log || {
            grep -E "error:" build.log | sort -u | head -40 | while IFS= read -r l; do echo "::error::${l:0:400}"; done
            exit 1
          }

      - name: Zip the app
        run: |
          app=$(ls -d build/Build/Products/Debug-iphonesimulator/*.app | head -1)
          echo "App: $app"
          ditto -c -k --sequesterRsrc --keepParent "$app" Ahead-simulator.zip
          ls -la Ahead-simulator.zip

      - name: Keep the zip with this run
        uses: actions/upload-artifact@v4
        with:
          name: Ahead-simulator
          path: CalendarWidgetApp/Ahead-simulator.zip

      - name: Publish the ios-simulator-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ios-simulator-latest --cleanup-tag --yes || true
          gh release create ios-simulator-latest Ahead-simulator.zip \
            --target "$GITHUB_SHA" --prerelease \
            --title "Ahead for the iOS Simulator (build ${{ github.run_number }})" \
            --notes "A simulator build of Ahead from commit ${GITHUB_SHA::7}, for Appetize.io or Xcode's simulator. Upload Ahead-simulator.zip to Appetize as an iOS app."

      - name: Upload to Appetize
        env:
          APPETIZE_API_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}
          APPETIZE_APP_KEY: ${{ vars.APPETIZE_APP_KEY }}
        run: |
          if [ -z "$APPETIZE_API_TOKEN" ]; then
            echo "::warning::No APPETIZE_API_TOKEN secret: upload Ahead-simulator.zip from the release by hand."
            exit 0
          fi
          upload() {
            curl -sS -X POST "$1" -H "X-API-KEY: $APPETIZE_API_TOKEN" \
              -F "file=@Ahead-simulator.zip" -F "platform=ios" -o appetize.json -w "%{http_code}"
          }
          # Updates the same Appetize app once APPETIZE_APP_KEY holds its public key; otherwise makes a new one.
          key="$APPETIZE_APP_KEY"
          if ! [[ "$key" =~ ^[a-z0-9_]{6,}$ ]]; then key=""; fi
          code=000
          if [ -n "$key" ]; then
            code=$(upload "https://api.appetize.io/v1/apps/$key")
            echo "Updating app $key: HTTP $code"
          fi
          if [ "${code:0:1}" != "2" ]; then
            code=$(upload "https://api.appetize.io/v1/apps")
            echo "Creating a new app: HTTP $code"
          fi
          [ "${code:0:1}" = "2" ] || { echo "::error::Appetize upload failed (HTTP $code): $(head -c 300 appetize.json)"; exit 1; }
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open("appetize.json"))
          url = d.get("publicURL") or d.get("appURL")
          print("Appetize link:", url)
          print("Public key (save as the APPETIZE_APP_KEY variable to keep one link):", d.get("publicKey"))
          print(f"::notice::Appetize: {url}")
          PY
