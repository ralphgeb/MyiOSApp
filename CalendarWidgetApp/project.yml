name: CalendarWidgetApp
options:
  bundleIdPrefix: com.yourname
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  CalendarWidgetApp:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - target: CalendarWidgetExtension      # embeds the widget inside the app
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Calendar Widget
        UILaunchScreen: {}
        NSCalendarsFullAccessUsageDescription: Shows your upcoming events in the widget.
    entitlements:
      path: Sources/App.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.yourname.calendarwidgetapp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.calendarwidgetapp

  CalendarWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - Widget
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Upcoming Events
        NSCalendarsFullAccessUsageDescription: Shows your upcoming events in the widget.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/Widget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.yourname.calendarwidgetapp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.calendarwidgetapp.widget
