name: CalendarWidgetApp
options:
  bundleIdPrefix: com.ralphgeb
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"      # the workflow overrides this with the run number
    CODE_SIGN_STYLE: Automatic

targets:
  CalendarWidgetApp:
    type: application
    platform: iOS
    sources:
      - Sources
      - Shared
    dependencies:
      - target: CalendarWidgetExtension      # embeds the widget inside the app
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Minimal
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.ralphgeb.calendarwidgetapp.refresh
        ITSAppUsesNonExemptEncryption: false   # skips the export-compliance question in TestFlight
        NSCalendarsFullAccessUsageDescription: Shows your upcoming events in the widget.
        NSLocationWhenInUseUsageDescription: Shows the weather where you are in the widget.
    entitlements:
      path: Sources/App.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ralphgeb.calendarwidgetapp
        com.apple.developer.weatherkit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ralphgeb.calendarwidgetapp
        TARGETED_DEVICE_FAMILY: "1,2"          # iPhone and iPad (the extra large widget is iPad-only)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  CalendarWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Upcoming Events
        NSCalendarsFullAccessUsageDescription: Shows your upcoming events in the widget.
        NSLocationWhenInUseUsageDescription: Shows the weather where you are in the widget.
        NSWidgetWantsLocation: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/Widget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ralphgeb.calendarwidgetapp
        com.apple.developer.weatherkit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ralphgeb.calendarwidgetapp.widget
        TARGETED_DEVICE_FAMILY: "1,2"
